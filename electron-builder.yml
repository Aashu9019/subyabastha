appId: com.aashutosh.subyabastha
productName: Subyabastha
copyright: Copyright © 2026 Aashutosh
directories:
  output: dist-installer
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: Subyabastha-Setup.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Subyabastha (by Aashutosh)
  uninstallDisplayName: Subyabastha (by Aashutosh)
  deleteAppDataOnUninstall: false
